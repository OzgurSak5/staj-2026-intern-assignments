name: Tests

on:
  push:
    branches: [develop, main]
    paths:
      - 'submissions/ozgur-sak-login/**'
  pull_request:
    paths:
      - 'submissions/ozgur-sak-login/**'

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: submissions/ozgur-sak-login/backend
        run: dotnet restore

      - name: Run backend tests
        working-directory: submissions/ozgur-sak-login/backend
        run: dotnet test Auth.Api.Tests/Auth.Api.Tests.csproj --logger "console;verbosity=normal"

  web-e2e:
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: authdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start backend
        working-directory: submissions/ozgur-sak-login/backend
        env:
          ConnectionStrings__DefaultConnection: 'Host=localhost;Port=5432;Database=authdb;Username=postgres;Password=devpassword'
          Jwt__Key: 'ci-only-test-key-not-a-real-secret-32b'
        run: |
          dotnet run --project Auth.Api --urls http://localhost:5075 &
          npx wait-on http://localhost:5075/swagger/v1/swagger.json --timeout 60000

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: submissions/ozgur-sak-login/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: submissions/ozgur-sak-login/web
        run: npx playwright install --with-deps chromium

      - name: Seed test user
        working-directory: submissions/ozgur-sak-login/web
        run: |
          curl -X POST http://localhost:5075/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"sifre1234"}'

      - name: Start web and run E2E tests
        working-directory: submissions/ozgur-sak-login/web
        run: |
          npm run dev -- --port 5173 &
          npx wait-on http://localhost:5173 --timeout 30000
          npx playwright test --project=chromium